  <!-- Main Nav -->
  <div class="main-nav">
    <div class="container nav-inner">
      <!-- Logo -->
      <a routerLink="/" class="logo-wrap" (click)="closeMenu()">
        <div class="logo-emblem">
          <div class="emblem-circle">
            <span class="emblem-diya">🪔</span>
          </div>
        </div>
        <div class="logo-text">
          <span class="logo-main">Shirdi Devasthan</span>
          <span class="logo-sub">Hospital & Research Centre</span>
          <span class="logo-trust">Sai Baba Sansthan Trust</span>
        </div>
      </a>

      <!-- Desktop Nav -->
      <nav class="desktop-nav">
        <a *ngFor="let link of navLinks"
           [routerLink]="link.path"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: link.path === '/' }"
           class="nav-link">
          <span class="nav-icon">{{ link.icon }}</span>
          {{ link.label }}
        </a>
        <a routerLink="/contact" class="btn-appointment">
          📅 Book Appointment
        </a>
      </nav>

      <!-- Hamburger -->
      <button class="hamburger" (click)="toggleMenu()" [class.open]="isMenuOpen" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div class="mobile-menu" [class.open]="isMenuOpen">
    <nav>
      <a *ngFor="let link of navLinks"
         [routerLink]="link.path"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: link.path === '/' }"
         class="mobile-nav-link"
         (click)="closeMenu()">
        <span>{{ link.icon }}</span> {{ link.label }}
      </a>
      <a routerLink="/contact" class="btn-appointment mobile-appt" (click)="closeMenu()">
        📅 Book Appointment
      </a>
    </nav>
  </div>
</header>

<div class="header-spacer"></div>
